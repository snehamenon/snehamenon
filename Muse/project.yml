name: Muse
options:
  bundleIdPrefix: com.snehamenon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "447768FX9F"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Muse:
    type: application
    platform: iOS
    settings:
      base:
        DEVELOPMENT_TEAM: "447768FX9F"
        CODE_SIGN_STYLE: Automatic
    sources:
      - path: Muse
    info:
      path: Muse/Info.plist
      properties:
        CFBundleDisplayName: Muse
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Muse scans your face geometry on this device to personalize makeup looks and tutorials. Camera images never leave your phone.
        NSLocationWhenInUseUsageDescription: Muse uses your approximate location to check local weather, so your look holds up in today's conditions.
        ITSAppUsesNonExemptEncryption: false
